name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Type check
        run: deno check src/
      - name: Test
        run: deno task test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version given: setup-biome reads the one pinned in pnpm-lock.yaml.
      - uses: biomejs/setup-biome@v2
      - name: Biome (read-only)
        run: biome ci .
